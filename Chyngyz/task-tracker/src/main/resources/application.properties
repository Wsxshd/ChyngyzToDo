spring.application.name=task-tracker
server.port=8008

# --- PostgreSQL (values can be overridden by environment variables) ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/taskdb}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# --- JPA: schema is created by schema.sql, Hibernate only maps entities ---
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_batch_fetch_size=50

# --- schema.sql + data.sql are executed on every start (they are idempotent) ---
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8

# --- nicer JSON in the browser ---
spring.jackson.serialization.indent-output=true
